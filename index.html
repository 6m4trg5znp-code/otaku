   T('Web novels',w=>w.type==='Web novel',{d:{type:'Web novel'}}),T('Light novels',w=>w.type==='Light novel',{d:{type:'Light novel'}}),

 {id:'genres',n:'Genres & Tropes',c:'--violet',g:'#',desc:'Retrouve tes fiches par genre ou trope',kind:'work',dynamic:'genres',tabs:[]},
 {id:'persos',n:'Personnages favoris',c:'--gold',g:'★',desc:'Protagonistes, antagonistes, couples, citations',kind:'char',tabs:[
   T('Protagonistes',c=>c.role==='Protagoniste',{d:{role:'Protagoniste'}}),T('Antagonistes',c=>c.role==='Antagoniste',{d:{role:'Antagoniste'}}),

   T('Citations et moments',c=>c.cit,{}),T('Classement',c=>c.rate>0,{sort:'rate',rank:1,noAdd:1,empty:'Note tes personnages de 1 à 10 pour les classer.'})]},
 {id:'classements',n:'Classements personnels',c:'--gold',g:'位',desc:'Top 10 calculés depuis tes notes',kind:'work',noAll:1,tabs:[
   top10('Top 10 anime',isAn),top10('Top 10 mangas',isT('Manga','One-shot')),top10('Top 10 manhwas',isT('Manhwa','Webtoon')),top10('Top 10 manhuas',isT('Manhua')),
   top10('Top 10 romans',isT('Web novel','Light novel')),top10('Top personnages',()=>true,'char'),
   T('Mes meilleures découvertes',w=>w.dec,{sort:'rate',noAdd:1,empty:'Coche « Meilleure découverte » dans une fiche.'}),
   T('Mes plus grandes déceptions',w=>w.decep,{sort:'rate',noAdd:1,empty:'Coche « Déception » dans une fiche.'})],
   cnt:()=>items.filter(i=>i.rate>0).length},
 {id:'reco',n:'Recommandations',c:'--blue',g:'✦',desc:'Amis, en ligne, similaires, à découvrir plus tard',kind:'work',noAll:1,tabs:[
   T('Recommandés par des amis',w=>w.reco==='Un ami',{d:{reco:'Un ami',status:'À découvrir'}}),T('Recommandations en ligne',w=>w.reco==='En ligne',{d:{reco:'En ligne',status:'À découvrir'}}),
   T('Œuvres similaires',w=>w.simil,{extra:'simil',noAdd:1,empty:'Renseigne « Œuvres similaires » dans une fiche.'}),T('À découvrir plus tard',w=>w.later,{d:{later:true,status:'À découvrir'}}),
   T('Œuvres sous-estimées',w=>w.sous,{d:{sous:true}}),T('Mes recommandations',w=>w.rec,{d:{rec:true}})],
   cnt:()=>items.filter(w=>w.kind==='work'&&(w.reco||w.later||w.sous||w.rec||w.simil)).length},
 {id:'progression',n:'Progression',c:'--blue',g:'↗',desc:'À commencer, en cours, en pause, terminé',kind:'work',noAll:1,tabs:[
   ...ST.map(s=>T(s==='À découvrir'?'À commencer':s,S(s),{d:{status:s},prog:s==='En cours'})),
   T('Prochaines sorties',w=>w.next,{extra:'next',noAdd:1,empty:'Renseigne « Prochaine saison ou prochain chapitre » dans une fiche.'})],
   cnt:()=>items.filter(w=>w.kind==='work'&&w.status==='En cours').length},
 {id:'gacha',n:'Gacha Games',c:'--gold',g:'◈',desc:'Jeux, personnages, équipes, ressources',kind:'game',noAll:1,tabs:[
   T('Jeux auxquels je joue',()=>true,{kind:'game'}),T('Personnages possédés',g=>g.obt==='Possédé',{kind:'gc',d:{obt:'Possédé'}}),
   T('Personnages recherchés',g=>g.obt==='Recherché',{kind:'gc',d:{obt:'Recherché'}}),T('Équipes et builds',g=>g.equipe||g.build,{kind:'gc'})],
   cnt:()=>items.filter(i=>i.kind==='game'||i.kind==='gc').length},
 {id:'archives',n:'Archives & Notes',c:'--violet',g:'録',desc:'Théories, lore, studios, citations',kind:'note',tabs:['Théories','Univers et lore','Studios et auteurs','Adaptations','Citations courtes','Notes diverses'].map(c=>T(c,n=>n.cat===c,{d:{cat:c}}))},
 {id:'bilan',n:'Bilan personnel',c:'--violet',g:'月',desc:'Découvertes et objectifs du mois',kind:'bilan',tabs:[],bilan:1}
];
const secById=id=>SECS.find(s=>s.id===id);
const pool=s=>items.filter(i=>i.kind===s.kind&&(!s.base||s.base(i)));
const secCount=s=>s.cnt?s.cnt():pool(s).length;

/* ---------- données : db si disponible, sinon navigateur ---------- */
let items=[],store=null,tabIdx={},qs={},sorts={},cur=null,curNew=false,flagSet=new Set();
const LS='otaku-archive-v1';
const clean=o=>JSON.parse(JSON.stringify(o));
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS))}catch(e){return null}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(items))}catch(e){}}
async function initStore(){
  let db=null;try{db=await claude.use('db')}catch(e){}
  if(db){
    const col=db.collection('items');
    store={save:async i=>{const {id,...d}=i;await col.doc(id).set(clean(d))},del:async id=>{await col.doc(id).delete()}};
    col.onSnapshot(s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  }else{
    items=lsLoad()||SEED.map((w,i)=>({...w,t:Date.now()-i}));
    store={save:async()=>lsSave(),del:async()=>lsSave()};
    render();
  }
}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),1900)}
const newId=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
async function put(i){
  i.t=Date.now();const x=items.findIndex(y=>y.id===i.id);
  if(x>=0)items[x]=i;else items.unshift(i);
  render();
  try{await store.save(i)}catch(e){toast('Enregistrement impossible')}
}
async function del(id){items=items.filter(i=>i.id!==id);render();try{await store.del(id)}catch(e){}}
function incProg(p){p=(p||'').trim();const m=p.match(/(\d+)(?!.*\d)/);if(!m)return '1';return p.slice(0,m.index)+(+m[1]+1)+p.slice(m.index+m[1].length)}

/* ---------- vues ---------- */
function route(){const h=location.hash.slice(1);return secById(h)||null}
function render(){
  const sec=route();
  $('#nav').innerHTML=SECS.map(s=>`<a href="#${s.id}" style="--c:var(${s.c})" ${sec&&sec.id===s.id?'aria-current="page"':''}>${s.n}</a>`).join('');
  sec?renderSection(sec):renderHome();
  const a=$('#nav [aria-current]');if(a&&a.scrollIntoView)try{a.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
}
function renderHome(){
  const W=items.filter(i=>i.kind==='work');
  const rated=W.filter(w=>w.rate>0);
  const avg=rated.length?(rated.reduce((a,w)=>a+ +w.rate,0)/rated.length).toFixed(1):'–';
  const nT=f=>W.filter(f).length;
  const tiles=[
   ['Anime','violet',nT(isAn),'#anime','Anime & fantasy'],
   ['Manga & Webtoon','rose',nT(isT('Manga','One-shot','Manhwa','Webtoon','Manhua')),'#manga','Romance & webtoons'],
   ['Novels','blue',nT(isT('Web novel','Light novel')),'#novels','Manga & novels'],
   ['Gacha Games','gold',items.filter(i=>i.kind==='gc').length,'#gacha','Gacha & classements']];
  const run=W.filter(w=>w.status==='En cours').sort((a,b)=>(b.t||0)-(a.t||0)).slice(0,6);
  const hasEx=items.some(i=>i.ex);
  $('#app').innerHTML=`
  <section class="hero"><h1>OTAKU<br>ARCHIVE</h1><div class="tag1">My personal anime universe</div>
   <p class="quote">Un univers, mille histoires, des découvertes infinies.</p></section>
  ${hasEx?`<div class="note"><span>Les fiches marquées « Exemple » servent de modèle.</span><button class="btn" data-clr>Supprimer les exemples</button></div>`:''}
  <div class="tiles">${tiles.map(t=>`<a class="tile" href="${t[3]}" style="--c:var(--${t[1]})"><em>${t[2]}</em><b>${t[0]}</b><span>${t[4]}</span></a>`).join('')}</div>
  <div class="stats">
   <div class="stat"><b>${W.length}</b><span>fiches d'œuvre</span></div>
   <div class="stat"><b>${nT(S('En cours'))}</b><span>en cours</span></div>
   <div class="stat"><b>${nT(S('Terminé'))}</b><span>terminées</span></div>
   <div class="stat"><b>${avg}</b><span>note moyenne</span></div></div>
  <section class="sec"><h2 class="h">En cours</h2><div class="list">${run.length?run.map(w=>cardHTML(w,{})).join(''):'<div class="empty">Rien en cours. Passe une fiche en « En cours » pour la suivre ici.</div>'}</div></section>
  <section class="sec"><h2 class="h">Navigation</h2><div class="navgrid">${SECS.map(s=>`<a class="nrow" href="#${s.id}" style="--c:var(${s.c})"><span class="gl">${s.g}</span><span><div class="t">${s.n}</div><div class="d">${s.desc}</div></span><span class="n">${secCount(s)}</span></a>`).join('')}</div></section>
  <section class="sec"><h2 class="h">Recherche dans toutes les fiches</h2>
   <input id="gq" type="search" placeholder="Titre, personnage, jeu, note…" style="border:1px solid var(--line);background:var(--s1);border-radius:10px;padding:10px 12px;width:100%">
   <div class="list" id="gres"></div></section>
  <p class="quote">Ma devise : un univers, mille histoires, des découvertes infinies.</p>`;
  $('#gq').oninput=e=>{
    const q=e.target.value.trim().toLowerCase();
    $('#gres').innerHTML=q?(items.filter(i=>Object.values(i).join(' ').toLowerCase().includes(q)).slice(0,30).map(i=>cardHTML(i,{})).join('')||'<div class="empty">Aucun résultat.</div>'):'';
  };
}
function tabsOf(sec){
  let tabs=[];
  if(sec.dynamic==='genres'){
    const used={};
    items.filter(i=>i.kind==='work').forEach(w=>[...tagsOf(w.genres),...tagsOf(w.tropes)].forEach(t=>used[t.toLowerCase()]=t));
    const all=[...GENRES];Object.values(used).forEach(t=>{if(!all.some(g=>g.toLowerCase()===t.toLowerCase()))all.push(t)});
    tabs=all.map(g=>T(g,w=>[...tagsOf(w.genres),...tagsOf(w.tropes)].some(t=>t.toLowerCase()===g.toLowerCase()),{d:{genres:g}}));
  }else tabs=sec.tabs.map(t=>({...t}));
  if(!sec.noAll)tabs.unshift(T('Tout',()=>true,{}));
  return tabs;
}
function tabItems(sec,tab){
  const kind=tab.kind||sec.kind;
  return items.filter(i=>i.kind===kind&&(i.kind!==sec.kind||!sec.base||sec.base(i))&&tab.f(i));
}
function renderSection(sec){
  const tabs=tabsOf(sec);let ti=Math.min(tabIdx[sec.id]||0,tabs.length-1);const tab=tabs[ti];
  const showTabs=tabs.length>1;
  $('#app').innerHTML=`<div style="--c:var(${sec.c});display:flex;flex-direction:column;gap:14px">
   <div class="shead"><h1><span class="gl" style="width:44px;height:44px;font-size:22px">${sec.g}</span>${sec.n}</h1>
    <div class="bar"><button class="btn" id="cpy">Copier la liste</button><button class="btn p" id="add">+ Ajouter</button></div></div>
   ${showTabs?`<div class="tabs" role="tablist">${tabs.map((t,i)=>`<button role="tab" data-ti="${i}" aria-selected="${i===ti}">${esc(t.n)}<small>${tabItems(sec,t).length}</small></button>`).join('')}</div>`:''}
   <div class="tools"><input id="q" type="search" placeholder="Rechercher dans cette liste" value="${esc(qs[sec.id]||'')}">
    <select id="so" aria-label="Trier"><option value="recent">Récents</option><option value="az">A → Z</option><option value="rate">Meilleure note</option></select></div>
   <div class="list" id="lst"></div></div>`;
  $('#so').value=sorts[sec.id]||'recent';
  const paint=()=>{
    let l=tabItems(sec,tab);const q=(qs[sec.id]||'').toLowerCase();
    if(q)l=l.filter(i=>Object.values(i).join(' ').toLowerCase().includes(q));
    const so=tab.sort||sorts[sec.id]||'recent';
    const tk=i=>String(i[K[i.kind].tk]||'');
    l.sort(so==='az'?(a,b)=>tk(a).localeCompare(tk(b)):so==='rate'?(a,b)=>(b.rate||0)-(a.rate||0):sec.bilan?(a,b)=>tk(b).localeCompare(tk(a)):(a,b)=>(b.t||0)-(a.t||0));
    if(tab.limit)l=l.slice(0,tab.limit);
    $('#lst').innerHTML=l.length?l.map((i,n)=>cardHTML(i,{rank:tab.rank?n+1:0,extra:tab.extra,acts:tab.prog||sec.kind==='work'})).join(''):`<div class="empty">${tab.empty||'Rien ici pour l\'instant. Touche « + Ajouter » pour créer une fiche.'}</div>`;
    paint.l=l;
  };
  paint();
  $('#q').oninput=e=>{qs[sec.id]=e.target.value;paint()};
  $('#so').onchange=e=>{sorts[sec.id]=e.target.value;paint()};
  const add=$('#add');add.disabled=!!tab.noAdd;
  add.onclick=()=>{const kind=tab.kind||sec.kind;openEdit({id:newId(),kind,...(kind===sec.kind?sec.d:{}),...tab.d},true)};
  $('#cpy').onclick=async()=>{
    const txt=sec.n+' · '+tab.n+'\n'+paint.l.map(i=>{const k=K[i.kind];const nm=i.kind==='bilan'?k.label(i.mois):i[k.tk];return `• ${nm}${i.status?' ('+i.status+')':''}${i.rate?' '+i.rate+'/10':''}${i.prog?' — '+i.prog:''}`}).join('\n');
    copy(txt);
  };
  const tb=$('.tabs');if(tb)tb.onclick=e=>{const b=e.target.closest('[data-ti]');if(b){tabIdx[sec.id]=+b.dataset.ti;renderSection(sec)}};
}
function cardHTML(i,o){
  const k=K[i.kind],inf=k.info(i);
  const name=i.kind==='bilan'?k.label(i.mois):(i[k.tk]||'Sans titre');
  const c=i.kind==='work'?STC[i.status||'À découvrir']:k.c;
  const lead=o.rank?`<span class="rank">${o.rank}</span>`:`<span class="dot" style="--c:var(${c})"></span>`;
  const flags=(k.flags||[]).filter(f=>i[f[0]]).map(f=>`<span class="chip hl">${f[1]}</span>`);
  const tags=[i.ex?'<span class="chip ex">Exemple</span>':'',...(inf.tags||[]).map(t=>`<span class="chip">${esc(t)}</span>`),...flags].join('');
  const extra=o.extra&&i[o.extra]?`<div class="pv">${o.extra==='simil'?'Similaire à : ':'Prochainement : '}${esc(i[o.extra])}</div>`:'';
  const acts=i.kind==='work'?`<div class="acts"><select data-st="${i.id}" aria-label="Statut">${ST.map(s=>`<option ${s===i.status?'selected':''}>${s}</option>`).join('')}</select>${i.status==='En cours'?`<button data-inc="${i.id}">+1 chapitre</button>`:''}</div>`:'';
  return `<div class="card"><button class="main" data-open="${i.id}"><span>${lead}</span>
   <span><div class="t">${esc(name)}</div>${inf.sub?`<div class="sb">${esc(inf.sub)}</div>`:''}${inf.pv?`<div class="pv">${esc(String(inf.pv).slice(0,110))}</div>`:''}${extra}${tags?`<div class="meta">${tags}</div>`:''}</span>
   <span class="side">${inf.rate?`<span class="rate">${inf.rate}/10</span>`:''}${inf.prog?`<span>${esc(inf.prog)}</span>`:''}</span></button>${acts}</div>`;
}

/* ---------- événements globaux ---------- */
document.addEventListener('click',e=>{
  const op=e.target.closest('[data-open]');if(op){const i=items.find(x=>x.id===op.dataset.open);if(i)openEdit({...i},false);return}
  const inc=e.target.closest('[data-inc]');if(inc){const i=items.find(x=>x.id===inc.dataset.inc);if(i)put({...i,prog:incProg(i.prog)});return}
  if(e.target.closest('[data-clr]')){const ex=items.filter(i=>i.ex);ex.forEach(i=>del(i.id));toast('Exemples supprimés')}
});
document.addEventListener('change',e=>{
  const s=e.target.closest('[data-st]');if(s){const i=items.find(x=>x.id===s.dataset.st);if(i)put({...i,status:s.value})}
});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

/* ---------- éditeur de fiche ---------- */
function fld(f,v){
  const [k,l,t,o={}]=f,id='f_'+k,val=v??'';
  let inp;
  if(t==='area')inp=`<textarea id="${id}" data-k="${k}" rows="3">${esc(val)}</textarea>`;
  else if(t==='sel')inp=`<select id="${id}" data-k="${k}">${o.o.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${x||'—'}</option>`).join('')}</select>`;
  else if(t==='rate')inp=`<select id="${id}" data-k="${k}" data-n="1">${RATES.map(x=>`<option value="${x}" ${String(val)===x?'selected':''}>${x?x+'/10':'—'}</option>`).join('')}</select>`;
  else inp=`<input id="${id}" data-k="${k}" type="${t==='text'?'text':t}" value="${esc(val)}" ${o.req?'required':''} ${o.ph?`placeholder="${esc(o.ph)}"`:''}>`;
  const wide=o.full||t==='area';
  return `<label class="${wide?'full':''}">${l}${inp}</label>`;
}
function openEdit(i,isNew){
  cur=i;curNew=isNew;flagSet=new Set((K[i.kind].flags||[]).filter(f=>i[f[0]]).map(f=>f[0]));
  const k=K[i.kind];
  const main=k.F.filter(f=>!(f[3]||{}).d),det=k.F.filter(f=>(f[3]||{}).d);
  $('#form').innerHTML=`<h3>${k.n}</h3>
   <div class="fg">${main.map(f=>fld(f,i[f[0]])).join('')}</div>
   ${det.length?`<details ${isNew?'':'open'}><summary>Détails de la fiche</summary><div class="fg">${det.map(f=>fld(f,i[f[0]])).join('')}</div></details>`:''}
   ${(k.flags||[]).length?`<div class="flags" id="flags"></div>`:''}
   <div class="foot"><button type="button" class="btn d" id="del" ${isNew?'hidden':''}>Supprimer</button>
    <div class="bar"><button type="button" class="btn" id="cp">Copier le texte</button><button type="button" class="btn" id="cn">Annuler</button><button type="submit" class="btn p" style="--c:var(--violet)">Enregistrer</button></div></div>`;
  drawFlags();
  $('#cn').onclick=()=>$('#dlg').close();
  $('#del').onclick=()=>{del(cur.id);$('#dlg').close()};
  $('#cp').onclick=()=>copy(toText(collect()));
  $('#dlg').showModal();
}
function drawFlags(){const f=$('#flags');if(!f)return;f.innerHTML=K[cur.kind].flags.map(([k,n])=>`<button type="button" class="flag" data-f="${k}" aria-pressed="${flagSet.has(k)}">${n}</button>`).join('');
  f.onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;flagSet.has(b.dataset.f)?flagSet.delete(b.dataset.f):flagSet.add(b.dataset.f);drawFlags()}}
function collect(){
  const o={id:cur.id,kind:cur.kind};if(cur.ex)o.ex=cur.ex;
  document.querySelectorAll('#form [data-k]').forEach(el=>{const v=el.value.trim();if(v!=='')o[el.dataset.k]=el.dataset.n?+v:v});
  flagSet.forEach(f=>o[f]=true);
  return o;
}
function toText(i){
  const k=K[i.kind];let o=(i.kind==='bilan'?k.label(i.mois):i[k.tk]||'')+'\n';
  k.F.forEach(f=>{const v=i[f[0]];if(v!==undefined&&v!==''&&f[0]!==k.tk)o+=`${f[1]} : ${f[0]==='rate'?v+'/10':v}\n`});
  (k.flags||[]).filter(f=>i[f[0]]).forEach(f=>o+=`${f[1]}\n`);
  return o.trim();
}
$('#form').addEventListener('submit',e=>{
  e.preventDefault();const o=collect();
  const k=K[o.kind];if(!o[k.tk]){toast('Le titre est obligatoire');return}
  if(o.ex&&!curNew)delete o.ex;
  put(o);$('#dlg').close();
});
async function copy(txt){
  try{await navigator.clipboard.writeText(txt);toast('Copié, prêt à coller dans tes notes')}
  catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.append(ta);ta.select();try{document.execCommand('copy');toast('Copié')}catch(_){toast('Copie impossible')}ta.remove()}
}


/* ---------- version autonome : sauvegarde et hors connexion ---------- */
const _rh=renderHome;
renderHome=function(){
  _rh();
  $('#app').insertAdjacentHTML('beforeend',`<section class="sec"><h2 class="h">Sauvegarde</h2>
   <p class="quote" style="margin:0">Tes fiches sont enregistrées sur ce téléphone. Exporte-les de temps en temps.</p>
   <div class="bar"><button class="btn" id="bx">Exporter mes fiches</button>
   <label class="btn" style="cursor:pointer;text-transform:none;letter-spacing:0;font:600 15px var(--body);color:var(--fg);display:inline-block">Importer<input id="bi" type="file" accept=".json,application/json" hidden></label></div></section>`);
  $('#bx').onclick=async()=>{
    const txt=JSON.stringify(items,null,1);
    try{const b=new Blob([txt],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='otaku-archive-sauvegarde.json';document.body.append(a);a.click();a.remove();toast('Sauvegarde exportée')}
    catch(e){copy(txt)}
  };
  $('#bi').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const d=JSON.parse(await f.text());if(!Array.isArray(d))throw 0;items=d;lsSave();render();toast('Fiches importées')}
    catch(err){toast('Fichier de sauvegarde invalide')}
  };
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

initStore();render();
</script>
